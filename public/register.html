<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase - Register</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="panel auth-box">
      <h1>Create Account</h1>
      <form id="auth-form" data-mode="register">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password (min 6 characters)</label>
          <input id="password" name="password" type="password" minlength="6" required autocomplete="new-password" />
        </div>
        <p class="form-error" id="form-error"></p>
        <button class="btn btn-primary btn-block" type="submit">Register</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login.html">Login</a></p>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
